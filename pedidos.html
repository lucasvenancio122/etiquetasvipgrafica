<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Pedidos de etiquetas | Vip Gráfica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
  :root { --bg:#F3F7FF; --ink:#101C3F; --ink-2:#3B4560; --line:#E1E7F3; --grey:#6B7385; --brand:#E5332B; --ok:#1FA855; --display:"Rowdies","Inter",system-ui,sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Inter",system-ui,sans-serif; }
  button,input,select,textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .oculta { display:none !important; }
  header { background:#fff; border-bottom:3px solid var(--brand); padding:10px 18px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header h1 { font-family:var(--display); font-size:19px; margin:0; flex:1; }
  .btn { border:1px solid var(--ink); background:#fff; border-radius:8px; padding:9px 14px; font-weight:600; font-size:14px; }
  .btn:hover { background:var(--ink); color:#fff; }
  .btn.p { background:var(--ink); color:#fff; }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .wrap { max-width:960px; margin:0 auto; padding:16px 18px 60px; }
  body.quadro-on .wrap { max-width:1360px; }
  body.quadro-on .barra input { max-width:460px; }
  .login { max-width:360px; margin:60px auto; background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:0 8px 24px rgba(16,28,63,.08); }
  .login h2 { font-family:var(--display); margin:0 0 4px; }
  label.f { display:block; font-weight:600; font-size:13px; margin-top:12px; }
  input,select,textarea { width:100%; border:1px solid #CBD3E6; border-radius:8px; padding:10px 12px; background:#fff; margin-top:4px; }
  .erro { color:#C42A23; font-weight:600; margin-top:10px; min-height:20px; }
  .barra { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
  .barra input { flex:1; min-width:180px; margin:0; }
  .chip { border:1px solid #CBD3E6; background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .ped { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(16,28,63,.05); }
  .ped.novo { border-left:6px solid var(--brand); }
  .topo { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline; }
  .cod { font-weight:800; font-size:17px; }
  .cli { font-weight:700; }
  .mut { color:var(--grey); font-size:13px; }
  .st { font-size:12px; font-weight:800; border-radius:999px; padding:3px 10px; background:#E1E7F3; text-transform:uppercase; letter-spacing:.3px; }
  .st.novo { background:var(--brand); color:#fff; } .st.pago,.st.entregue { background:#D6F3E1; color:#0F6B36; } .st.cancelado { background:#eee; color:#777; }
  .itens { margin:10px 0; display:grid; gap:8px; }
  .it { display:flex; gap:12px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:8px; }
  .it img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); flex:none; background:#f2f2f2; }
  .it > div > b:first-child { display:block; } .it span { color:var(--ink-2); font-size:13.5px; }
  .acoes { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-top:10px; }
  .acoes label { flex:1; min-width:150px; margin:0; font-size:12px; }
  .vazio { text-align:center; color:var(--grey); padding:40px 0; }
  .modos { display:flex; gap:6px; }
  .modo { border:1px solid #CBD3E6; background:#fff; border-radius:8px; padding:7px 13px; font-size:13.5px; font-weight:600; }
  .modo.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .quadro { display:grid; grid-template-columns:repeat(5,minmax(210px,1fr)); gap:10px; align-items:start; overflow-x:auto; padding-bottom:10px; }
  .coluna { background:#EBF0FA; border-radius:12px; padding:9px; min-height:120px; }
  .coluna.alvo { outline:2px dashed var(--brand); outline-offset:-3px; background:#FDEDEB; }
  .col-cab { display:flex; align-items:center; gap:7px; font-weight:800; font-size:13.5px; margin:2px 4px 9px; }
  .col-bola { width:10px; height:10px; border-radius:50%; flex:none; }
  .col-sub { margin:-5px 4px 9px; font-size:11.5px; color:var(--grey); font-weight:600; }
  .totalzao { display:flex; gap:14px; flex-wrap:wrap; align-items:baseline; background:#fff; border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:10px; padding:9px 14px; margin-bottom:12px; font-size:14px; }
  .col-n { margin-left:auto; background:#fff; border-radius:999px; padding:1px 8px; font-size:12px; color:var(--grey); }
  .cartao { background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 10px; margin-bottom:8px; cursor:grab; box-shadow:0 1px 2px rgba(16,28,63,.06); }
  .cartao:active { cursor:grabbing; }
  .cartao.arrastando { opacity:.4; }
  .cartao.volta { border-color:#E5332B; border-width:2px; background:#FFF6F5; }
  .cartao .c1 { display:flex; gap:6px; align-items:baseline; }
  .cartao .cd { font-weight:800; font-size:12.5px; }
  .cartao .vl { margin-left:auto; font-weight:800; font-size:12.5px; }
  .cartao .cn { font-weight:700; font-size:13.5px; margin:2px 0 1px; }
  .cartao .ci { font-size:12px; color:var(--ink-2); line-height:1.35; }
  .cartao .av { display:inline-block; margin-top:5px; font-size:11px; font-weight:800; color:#B3261E; background:#FDEDEB; border-radius:5px; padding:2px 6px; }
  .cartao .pes { display:flex; gap:5px; margin-top:7px; flex-wrap:wrap; }
  .pes .mv { border:1px solid #CBD3E6; background:#fff; border-radius:6px; padding:3px 8px; font-size:11.5px; font-weight:700; }
  .pes .mv:hover { background:var(--ink); color:#fff; }
  .sel { display:flex; align-items:center; margin-right:2px; }
  .sel input { width:17px; height:17px; margin:0; accent-color:#E5332B; cursor:pointer; }
  .cartao.marcado { border-color:var(--ink); box-shadow:0 0 0 2px rgba(16,28,63,.15); }
  .mv.forte { background:var(--ink); color:#fff; border-color:var(--ink); }
  .apaga { color:#B3261E; border-color:#F0C2BF; }
  .apaga:hover { background:#E5332B; border-color:#E5332B; color:#fff; }
  .av.perso { color:#8A4FD3; background:#F3EBFC; }
  #lote { display:none; }
  #lote.on { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:9; gap:8px; align-items:center; flex-wrap:wrap;
    background:#101C3F; color:#fff; padding:11px 18px; box-shadow:0 -3px 14px rgba(16,28,63,.25); }
  #lote .btn { background:#fff; color:var(--ink); border-color:#fff; }
  #lote .btn:hover { background:#E5332B; border-color:#E5332B; color:#fff; }
  #lote .btn.p { background:#E5332B; border-color:#E5332B; color:#fff; }
  /* tela de uma etapa so */
  .etapa-cab { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .etapa-cab h2 { font-family:var(--display); margin:0; font-size:22px; }
  .etapa-cab .col-n { background:#E1E7F3; }
  .linha-ped { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .linha-ped.volta { border-color:#E5332B; border-width:2px; background:#FFF6F5; }
  .linha-ped .info { flex:1; min-width:180px; }
  .linha-ped .cd { font-weight:800; font-size:15px; }
  .linha-ped .cn { font-weight:700; }
  .linha-ped .ci { font-size:13px; color:var(--ink-2); }
  .btn.grande { padding:13px 20px; font-size:15px; }
  @media (max-width:860px) {
    .quadro { grid-template-columns:repeat(5,82vw); gap:12px; scroll-snap-type:x mandatory; margin:0 -18px; padding:0 18px 12px; }
    .coluna { scroll-snap-align:center; }
    .barra .modos { width:100%; }
    .modo { flex:1; }
  }
  .ver { font-weight:700; color:var(--brand); }
</style>
</head>
<body>
<div id="telaLogin" class="login">
  <h2>Pedidos de etiquetas</h2>
  <p class="mut">Área da equipe Vip Gráfica. Entre com o seu usuário do sistema.</p>
  <form id="fLogin">
    <label class="f">Usuário<input id="lUser" autocomplete="username" autocapitalize="none" required></label>
    <label class="f">Senha<input id="lPass" type="password" autocomplete="current-password" required></label>
    <div class="erro" id="lErro"></div>
    <button class="btn p" style="width:100%" id="lBtn">Entrar</button>
  </form>
</div>

<div id="telaApp" class="oculta">
  <header><h1>Pedidos de etiquetas</h1><span class="mut" id="quem"></span><button class="btn" id="atualizar" type="button">Atualizar</button><button class="btn" id="sair" type="button">Sair</button></header>
  <div class="wrap">
    <div class="barra"><input id="busca" placeholder="Buscar pelo código, nome do cliente ou telefone…"><div class="modos" id="modos"><button class="modo on" type="button" data-modo="quadro">Quadro</button><button class="modo" type="button" data-modo="lista">Lista</button></div></div>
    <div id="lista"></div>
    <div id="lote"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://ogqiuggdofxhyffamymg.supabase.co";
  var KEY = "sb_publishable_uwzbFJqhfJ9dWhqJHzDryg_IhGwzj57";
  var SESSAO_KEY = "etiquetas:pedidos:sessao";
  var ETAPAS = [["novo","Novo","#E5332B"],["arte","Arte","#8A4FD3"],["producao","Produção","#C77700"],["expedicao","Expedição","#0E7BBF"],["entregue","Entregue","#1FA855"]];
  function etapaNome(s) { for (var i = 0; i < ETAPAS.length; i++) if (ETAPAS[i][0] === s) return ETAPAS[i][1]; return s; }
  function conta(l) {
    var c = { pedidos: l.length, cartelas: 0, etiquetas: 0 };
    l.forEach(function (p) { (p.itens || []).forEach(function (i) { var q = Number(i.qtd) || 0; c.cartelas += q; c.etiquetas += q * (Number(i.etiquetas) || 0); }); });
    return c;
  }
  function nmr(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
  function resumoConta(l, curto) {
    var c = conta(l);
    if (!c.pedidos) return "";
    return (curto ? "" : nmr(c.pedidos) + (c.pedidos === 1 ? " pedido · " : " pedidos · ")) +
      nmr(c.cartelas) + (c.cartelas === 1 ? " cartela" : " cartelas");
  }
  function precisaArte(p) { return (p.itens || []).some(function (i) { return i.acombinar === true || (i.descricao || "").length > 1; }); }
  function proxima(p) { var i = etapaIdx(p.status); if (p.status === "novo" && !precisaArte(p)) return "producao"; return i < ETAPAS.length - 1 ? ETAPAS[i + 1][0] : null; }
  function anterior(p) { var i = etapaIdx(p.status); if (p.status === "producao" && !precisaArte(p)) return "novo"; return i > 0 ? ETAPAS[i - 1][0] : null; }
  function etapaCor(s) { for (var i = 0; i < ETAPAS.length; i++) if (ETAPAS[i][0] === s) return ETAPAS[i][2]; return "#6B7385"; }
  function etapaIdx(s) { for (var i = 0; i < ETAPAS.length; i++) if (ETAPAS[i][0] === s) return i; return 0; }
  var st = { sessao: null, usuario: "", admin: false, pedidos: [], filtro: "ativos", busca: "", timer: null, modo: "quadro", selecao: {}, etapa: null };
  (function () { var m = /[?&]etapa=([a-z]+)/.exec(location.search); if (m && ["novo","arte","producao","expedicao","entregue"].indexOf(m[1]) >= 0) st.etapa = m[1]; })();
  try { st.modo = localStorage.getItem("etiquetas:modo") || "quadro"; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function totalTxt(p) { var itens = p.itens || []; return (Number(p.total) === 0 && itens.length && itens.every(function (i) { return i.acombinar; })) ? "a combinar" : brl(p.total); }
  function cpfBr(c) { var d = String(c || "").replace(/\D/g, ""); return d.length === 11 ? d.slice(0,3) + "." + d.slice(3,6) + "." + d.slice(6,9) + "-" + d.slice(9) : (c || ""); }
  function brl(n) { return "R$ " + Number(n).toFixed(2).replace(".", ","); }
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function dataBr(iso) { var d = new Date(iso); return p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); }
  
  function imgSeg(u) { u = String(u || ""); return /^(https:\/\/|temas\/[A-Za-z0-9\/_.-]+\.(jpg|png)$)/.test(u) ? u : ""; }

  // ---- sessão (mesmos usuários do sistema, sessão própria desta página) ----
  function emailDe(u) { return u.trim().toLowerCase().replace(/[^a-z0-9._-]/g, "") + "@vipgrafica.internal"; }
  function tokenAuth(grant, corpo) {
    return fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + grant, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok || !x.d.access_token) throw new Error("Usuário ou senha incorretos.");
        return { access_token: x.d.access_token, refresh_token: x.d.refresh_token, expires_at: Date.now() + (Number(x.d.expires_in) || 3600) * 1000 };
      });
  }
  function salvarSessao() { try { sessionStorage.setItem(SESSAO_KEY, JSON.stringify({ s: st.sessao, u: st.usuario })); } catch (e) {} }
  function token() {
    if (!st.sessao) return Promise.reject(new Error("Sessão encerrada."));
    if (st.sessao.expires_at - Date.now() > 60000) return Promise.resolve(st.sessao.access_token);
    return tokenAuth("refresh_token", { refresh_token: st.sessao.refresh_token }).then(function (s) { st.sessao = s; salvarSessao(); return s.access_token; }, function () { sair(); throw new Error("Sessão expirada."); });
  }
  function api(metodo, caminho, corpo) {
    return token().then(function (t) {
      return fetch(SUPABASE_URL + "/rest/v1/" + caminho, { method: metodo, headers: { apikey: KEY, Authorization: "Bearer " + t, "Content-Type": "application/json", Prefer: "return=representation" }, body: corpo ? JSON.stringify(corpo) : undefined });
    }).then(function (r) { if (!r.ok) throw new Error("Erro " + r.status); return r.json(); });
  }
  function sair() { st.sessao = null; clearInterval(st.timer); try { sessionStorage.removeItem(SESSAO_KEY); } catch (e) {} $("telaApp").classList.add("oculta"); $("telaLogin").classList.remove("oculta"); $("lPass").value = ""; }
  function entrar() {
    $("telaLogin").classList.add("oculta"); $("telaApp").classList.remove("oculta"); $("quem").textContent = st.usuario;
    if (st.etapa) { $("modos").classList.add("oculta"); document.title = etapaNome(st.etapa) + " · Pedidos de etiquetas"; }
    verSeEhAdmin().then(render); carregar(); clearInterval(st.timer); st.timer = setInterval(carregar, 60000);
  }
  $("fLogin").addEventListener("submit", function (e) {
    e.preventDefault(); $("lErro").textContent = ""; var b = $("lBtn"); b.disabled = true;
    var u = $("lUser").value;
    tokenAuth("password", { email: emailDe(u), password: $("lPass").value }).then(function (s) { st.sessao = s; st.usuario = u.trim().toLowerCase(); salvarSessao(); entrar(); },
      function (er) { $("lErro").textContent = er.message; }).then(function () { b.disabled = false; });
  });
  $("sair").onclick = sair;
  $("atualizar").onclick = carregar;

  // ---- lista ----
  function verSeEhAdmin() {
    return token().then(function (t) {
      return fetch(SUPABASE_URL + "/rest/v1/rpc/vip_eh_admin", { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: "{}" });
    }).then(function (r) { return r.ok ? r.json() : false; }).then(function (x) { st.admin = x === true; }, function () { st.admin = false; });
  }
  function excluir(p) {
    if (!st.admin) return;
    if (!confirm("Apagar de vez o pedido " + p.codigo + ", de " + p.cliente + "?\n\nIsso não tem como desfazer.")) return;
    if (!confirm("Tem certeza? O pedido " + p.codigo + " some do banco para sempre.")) return;
    api("DELETE", "pedidos_etiquetas?id=eq." + encodeURIComponent(p.id)).then(function (r) {
      if (!r.length) throw new Error("sem permissão");
      st.pedidos = st.pedidos.filter(function (x) { return x.id !== p.id; });
      delete st.selecao[p.id]; render();
    }, function () { alert("Não consegui apagar. Só administrador pode excluir pedido."); });
  }
  function carregar() {
    api("GET", "pedidos_etiquetas?select=*&order=criado_em.desc&limit=300").then(function (l) { st.pedidos = l; render(); },
      function (er) { $("lista").innerHTML = '<div class="vazio">Não consegui carregar os pedidos (' + esc(er.message) + ').</div>'; });
  }
  var baixadas = {}; try { baixadas = JSON.parse(localStorage.getItem("etiquetas:baixadas") || "{}"); } catch (e) {}
  function visiveis() {
    var q = st.busca.trim().toLowerCase();
    var qn = q.replace(/[.\-\s]/g, "");
    return st.pedidos.filter(function (p) { return p.status !== "cancelado" && (!q || (p.codigo + " " + p.cliente + " " + (p.telefone || "")).toLowerCase().indexOf(q) >= 0 || (qn && String(p.cpf || "").indexOf(qn) >= 0)); });
  }
  function mover(p, novo) {
    if (novo === p.status) return;
    var corpo = { status: novo, atualizado_em: new Date().toISOString(), movido_por: st.usuario.slice(0, 40) };
    if (p.status === "expedicao" && novo === "producao") {
      var motivo = (prompt("Por que o pedido " + p.codigo + " está voltando para a produção?") || "").trim();
      if (motivo.length < 3) { if (motivo !== "") alert("Escreva o motivo com um pouco mais de detalhe."); return; }
      corpo.devolvido = true; corpo.motivo_devolucao = motivo.slice(0, 300);
    }
    var antes = { s: p.status, d: p.devolvido, m: p.motivo_devolucao };
    Object.assign(p, corpo); render();
    api("PATCH", "pedidos_etiquetas?id=eq." + encodeURIComponent(p.id), corpo).then(function (r) {
      if (!r.length) throw new Error("sem permissão"); Object.assign(p, r[0]); render();
    }, function () { p.status = antes.s; p.devolvido = antes.d; p.motivo_devolucao = antes.m; render(); alert("Não consegui mover o pedido. Tente de novo."); });
  }
  function moverVarios(ids, novo) {
    var l = ids.map(function (id) { return st.pedidos.filter(function (x) { return x.id === id; })[0]; }).filter(Boolean);
    if (!l.length) return;
    var corpoBase = { status: novo, movido_por: st.usuario.slice(0, 40) };
    var voltando = l.filter(function (p) { return p.status === "expedicao" && novo === "producao"; });
    if (voltando.length) {
      var motivo = (prompt("Por que " + (voltando.length > 1 ? "esses " + voltando.length + " pedidos estão voltando" : "o pedido " + voltando[0].codigo + " está voltando") + " para a produção?") || "").trim();
      if (motivo.length < 3) { if (motivo !== "") alert("Escreva o motivo com um pouco mais de detalhe."); return; }
      corpoBase.devolvido = true; corpoBase.motivo_devolucao = motivo.slice(0, 300);
    }
    var falhou = 0, feitos = 0;
    st.selecao = {}; render();
    l.reduce(function (pr, p) {
      return pr.then(function () {
        var corpo = Object.assign({ atualizado_em: new Date().toISOString() }, corpoBase);
        return api("PATCH", "pedidos_etiquetas?id=eq." + encodeURIComponent(p.id), corpo)
          .then(function (r) { if (r.length) { Object.assign(p, r[0]); feitos++; } else falhou++; }, function () { falhou++; });
      });
    }, Promise.resolve()).then(function () {
      render();
      if (falhou) alert("Movi " + feitos + " pedido(s). " + falhou + " não consegui mover; tente de novo.");
    });
  }
  function selecionados() { return Object.keys(st.selecao).filter(function (k) { return st.selecao[k]; }); }
  function barraLote() {
    var ids = selecionados(); var el = $("lote");
    if (!ids.length) { el.className = ""; el.innerHTML = ""; return; }
    var l = ids.map(function (id) { return st.pedidos.filter(function (x) { return x.id === id; })[0]; }).filter(Boolean);
    var etapas = {}; l.forEach(function (p) { etapas[p.status] = 1; });
    var mesma = Object.keys(etapas).length === 1 ? l[0] : null, bts = "";
    if (mesma) {
      var ant = anterior(mesma), pro = proxima(mesma);
      if (pro) bts += '<button class="btn sm p" type="button" data-lote="' + pro + '">Mover para ' + esc(etapaNome(pro)) + " ›</button>";
      if (ant) bts += '<button class="btn sm" type="button" data-lote="' + ant + '">‹ Voltar para ' + esc(etapaNome(ant)) + "</button>";
    } else {
      bts = ETAPAS.map(function (et) { return '<button class="btn sm" type="button" data-lote="' + et[0] + '">' + esc(et[1]) + "</button>"; }).join("");
    }
    el.className = "on";
    el.innerHTML = '<span><b>' + ids.length + '</b> selecionado(s)</span>' + bts +
      '<button class="btn sm" type="button" data-lote-limpa>Limpar</button>';
  }
  function cartao(p) {
    var it = (p.itens || []), n = it.reduce(function (a, i) { return a + (Number(i.qtd) || 0); }, 0);
    var resumo = it.slice(0, 2).map(function (i) { return i.qtd + "× " + i.modeloNome + " · " + i.temaNome; }).join("<br>") + (it.length > 2 ? "<br>+ " + (it.length - 2) + " item(ns)" : "");
    var ant = anterior(p), pro = proxima(p), pes = "";
    if (ant) pes += '<button class="mv" type="button" data-mv="' + esc(ant) + '">‹ ' + esc(etapaNome(ant)) + "</button>";
    if (pro) pes += '<button class="mv forte" type="button" data-mv="' + esc(pro) + '">' + esc(etapaNome(pro)) + " ›</button>";
    pes += '<button class="mv" type="button" data-png>Via</button>';
    if (st.admin) pes += '<button class="mv apaga" type="button" data-del title="Apagar o pedido">Excluir</button>';
    return '<div class="cartao' + (p.devolvido ? " volta" : "") + (st.selecao[p.id] ? " marcado" : "") + '" draggable="true" data-id="' + esc(p.id) + '">' +
      '<div class="c1"><label class="sel"><input type="checkbox" data-sel' + (st.selecao[p.id] ? " checked" : "") + '></label><span class="cd">' + esc(p.codigo) + '</span><span class="vl">' + totalTxt(p) + "</span></div>" +
      '<div class="cn">' + esc(p.cliente) + "</div>" +
      '<div class="ci">' + resumo + " · " + nmr(n) + (n === 1 ? " cartela" : " cartelas") + ((p.status === "expedicao" || p.status === "entregue") && p.cpf ? "<br>CPF: <b>" + esc(cpfBr(p.cpf)) + "</b>" : "") + "</div>" +
      (precisaArte(p) ? '<span class="av perso">tema personalizado · precisa de arte</span>' : "") +
      (p.devolvido && p.motivo_devolucao ? '<span class="av">voltou: ' + esc(p.motivo_devolucao) + "</span>" : "") +
      '<div class="pes">' + pes + "</div></div>";
  }
  function renderQuadro(l) {
    var dica = window.matchMedia && window.matchMedia("(max-width:860px)").matches ? '<p class="mut" style="font-size:12px;margin:0 0 8px">Arraste para o lado para ver as outras etapas.</p>' : "";
    var naFila = l.filter(function (p) { return p.status !== "entregue"; });
    var topo = l.length ? '<div class="totalzao"><span><b>Em aberto:</b> ' + esc(resumoConta(naFila)) + "</span>" + (l.length !== naFila.length ? '<span class="mut">Tudo, com os entregues: ' + esc(resumoConta(l)) + "</span>" : "") + "</div>" : "";
    $("lista").innerHTML = dica + topo + '<div class="quadro">' + ETAPAS.map(function (et) {
      var dela = l.filter(function (p) { return p.status === et[0]; });
      return '<section class="coluna" data-col="' + et[0] + '"><div class="col-cab"><span class="col-bola" style="background:' + et[2] + '"></span>' + esc(et[1]) + '<span class="col-n">' + dela.length + "</span></div>" +
        (dela.length ? '<div class="col-sub">' + esc(resumoConta(dela, true)) + "</div>" : "") +
        (dela.length ? dela.map(cartao).join("") : '<p class="mut" style="text-align:center;padding:10px 0;font-size:12.5px">—</p>') + "</section>";
    }).join("") + "</div>";
  }
  function linhaPed(p) {
    var it = (p.itens || []), n = it.reduce(function (a, i) { return a + (Number(i.qtd) || 0); }, 0);
    var resumo = it.map(function (i) { return i.qtd + "× " + i.modeloNome + " · " + i.temaNome + (i.nome ? " (" + i.nome + ")" : ""); }).join(" | ");
    var pro = proxima(p);
    return '<div class="linha-ped' + (p.devolvido ? " volta" : "") + '" data-id="' + esc(p.id) + '">' +
      '<label class="sel"><input type="checkbox" data-sel' + (st.selecao[p.id] ? " checked" : "") + '></label>' +
      '<div class="info"><div class="cd">' + esc(p.codigo) + ' · <span class="cn">' + esc(p.cliente) + "</span></div>" +
      '<div class="ci">' + esc(resumo) + " · " + nmr(n) + (n === 1 ? " cartela" : " cartelas") + ((p.status === "expedicao" || p.status === "entregue") && p.cpf ? " · CPF " + esc(cpfBr(p.cpf)) : "") + "</div>" +
      (precisaArte(p) ? '<span class="av perso">tema personalizado · precisa de arte</span>' : "") +
      (p.devolvido && p.motivo_devolucao ? '<span class="av">voltou: ' + esc(p.motivo_devolucao) + "</span>" : "") + "</div>" +
      '<button class="btn sm" type="button" data-png>Via</button>' +
      (st.admin ? '<button class="btn sm apaga" type="button" data-del>Excluir</button>' : "") +
      (pro ? '<button class="btn p grande" type="button" data-mv="' + esc(pro) + '">' + esc(etapaNome(pro)) + " ›</button>" : "") + "</div>";
  }
  function renderEtapa(l) {
    var dela = l.filter(function (p) { return p.status === st.etapa; });
    $("lista").innerHTML = '<div class="etapa-cab"><span class="col-bola" style="background:' + etapaCor(st.etapa) + '"></span><h2>' + esc(etapaNome(st.etapa)) + '</h2><span class="col-n">' + dela.length + '</span>' +
      (dela.length > 1 ? '<button class="btn sm" type="button" id="marcaTodos" style="margin-left:auto">Marcar todos</button>' : "") + "</div>" +
      (dela.length ? '<div class="totalzao"><span><b>Para fazer:</b> ' + esc(resumoConta(dela)) + "</span></div>" : "") +
      (dela.length ? dela.map(linhaPed).join("") : '<div class="vazio">Nenhum pedido em ' + esc(etapaNome(st.etapa)) + " agora.</div>");
  }
  function render() {
    var l = visiveis();
    if (st.etapa) { document.body.classList.remove("quadro-on"); renderEtapa(l); return barraLote(); }
    Array.prototype.forEach.call(document.querySelectorAll(".modo"), function (b) { b.classList.toggle("on", b.getAttribute("data-modo") === st.modo); });
    document.body.classList.toggle("quadro-on", st.modo === "quadro");
    if (st.modo === "quadro") { renderQuadro(l); return barraLote(); }
    barraLote();
    if (!l.length) { $("lista").innerHTML = '<div class="vazio">Nenhum pedido por aqui.</div>'; return; }
    $("lista").innerHTML = l.map(function (p) {
      var itens = (p.itens || []).map(function (i) {
        var im = imgSeg(i.foto);
        return '<div class="it">' + (im ? '<img src="' + esc(im) + '" alt="" loading="lazy">' : "") + "<div><b>" + esc(i.qtd) + "× " + esc(i.modeloNome) + " · " + esc(i.temaNome) + "</b><span>" + esc(i.etiquetas) + " etiquetas · " + (i.acombinar ? "<b>valor a combinar</b>" : brl(i.preco) + " cada") +
          (i.descricao ? "<br><b>Tema personalizado:</b> " + esc(i.descricao) : "") +
          (i.nome ? "<br>Nome: <b>" + esc(i.nome) + "</b>" : "") + (i.serie ? " · Série: <b>" + esc(i.serie) + "</b>" : "") + (i.obs ? "<br>Obs: " + esc(i.obs) : "") + "</span></div></div>";
      }).join("");
      var fone = (p.telefone || "").replace(/\D/g, "");
      return '<div class="ped ' + esc(p.status) + '" data-id="' + esc(p.id) + '"><div class="topo"><span class="cod">' + esc(p.codigo) + '</span><span class="cli">' + esc(p.cliente) + "</span>" +
        (fone ? '<a class="ver" target="_blank" rel="noopener" href="https://wa.me/55' + fone.replace(/^55/, "") + '">' + esc(p.telefone) + "</a>" : "") + (p.cpf ? '<span class="mut">CPF ' + esc(cpfBr(p.cpf)) + "</span>" : "") + '<span class="mut">' + dataBr(p.criado_em) + '</span>' + ((p.itens || []).some(function (x) { return x.acombinar; }) ? '<span class="st" style="background:#FDEDEB;color:#B3261E">tema personalizado</span>' : "") + '<span class="st" style="background:' + etapaCor(p.status) + ';color:#fff">' + esc(etapaNome(p.status)) + "</span>" + (baixadas[p.id] ? '<span class="st pago">✔ via baixada</span>' : "") + '<b style="margin-left:auto">' + totalTxt(p) + "</b></div>" +
        '<div class="itens">' + itens + '</div><div class="acoes"><button class="btn p" type="button" data-png>Baixar via</button></div></div>';
    }).join("");
  }
  function pedidoDe(el) { var id = el.getAttribute("data-id"); return st.pedidos.filter(function (x) { return x.id === id; })[0]; }
  document.addEventListener("click", function (e) {
    var lt = e.target.closest("[data-lote]");
    if (lt) return moverVarios(selecionados(), lt.getAttribute("data-lote"));
    if (e.target.closest("[data-lote-limpa]")) { st.selecao = {}; return render(); }
    if (e.target.id === "marcaTodos") {
      var vis = visiveis().filter(function (p) { return p.status === st.etapa; });
      var todos = vis.every(function (p) { return st.selecao[p.id]; });
      vis.forEach(function (p) { st.selecao[p.id] = !todos; });
      return render();
    }
    var cb = e.target.closest("[data-sel]");
    if (cb) {
      var cx = e.target.closest(".cartao, .linha-ped"); if (!cx) return;
      var id = cx.getAttribute("data-id"); st.selecao[id] = !st.selecao[id];
      return render();
    }
    var m = e.target.closest(".modo");
    if (m) { st.modo = m.getAttribute("data-modo"); try { localStorage.setItem("etiquetas:modo", st.modo); } catch (er) {} return render(); }
    var card = e.target.closest(".ped, .cartao, .linha-ped"); if (!card) return;
    var p = pedidoDe(card); if (!p) return;
    var mv = e.target.closest("[data-mv]");
    if (mv) return mover(p, mv.getAttribute("data-mv"));
    if (e.target.closest("[data-del]")) return excluir(p);
    if (e.target.closest("[data-png]")) { baixarPng(p); baixadas[p.id] = 1; try { localStorage.setItem("etiquetas:baixadas", JSON.stringify(baixadas)); } catch (er) {} render(); }
  });
  // arrastar e soltar
  var arrastando = null;
  document.addEventListener("dragstart", function (e) {
    var c = e.target.closest(".cartao"); if (!c) return;
    arrastando = pedidoDe(c); c.classList.add("arrastando");
    try { e.dataTransfer.setData("text/plain", c.getAttribute("data-id")); e.dataTransfer.effectAllowed = "move"; } catch (er) {}
  });
  document.addEventListener("dragend", function () {
    arrastando = null;
    Array.prototype.forEach.call(document.querySelectorAll(".arrastando"), function (c) { c.classList.remove("arrastando"); });
    Array.prototype.forEach.call(document.querySelectorAll(".alvo"), function (c) { c.classList.remove("alvo"); });
  });
  document.addEventListener("dragover", function (e) {
    var col = e.target.closest(".coluna"); if (!col || !arrastando) return;
    e.preventDefault();
    Array.prototype.forEach.call(document.querySelectorAll(".alvo"), function (c) { if (c !== col) c.classList.remove("alvo"); });
    col.classList.add("alvo");
  });
  document.addEventListener("drop", function (e) {
    var col = e.target.closest(".coluna"); if (!col || !arrastando) return;
    e.preventDefault(); col.classList.remove("alvo");
    var p = arrastando; arrastando = null; mover(p, col.getAttribute("data-col"));
  });
  $("busca").addEventListener("input", function () { st.busca = this.value; render(); });

  // ---- via ----
  function carregarImg(src) { return new Promise(function (res) { if (!src) return res(null); var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = src; }); }
  function quebra(ctx, txt, max) { var pal = String(txt).split(/\s+/), lin = [], at = ""; pal.forEach(function (w) { var t = at ? at + " " + w : w; if (ctx.measureText(t).width > max && at) { lin.push(at); at = w; } else at = t; }); if (at) lin.push(at); return lin; }
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function baixarPng(p) {
    var itens = p.itens || [];
    var fontes = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load("800 30px Inter"), document.fonts.load("700 30px Rowdies")]).catch(function () {}) : Promise.resolve();
    Promise.all([fontes].concat(itens.map(function (i) { return carregarImg(imgSeg(i.foto)); }))).then(function (r) {
      var imgs = r.slice(1), W = 1080, P = 48, cv = document.createElement("canvas"), ctx = cv.getContext("2d");
      cv.width = W; ctx.font = "600 24px Inter, sans-serif";
      var alt = itens.map(function (i) { return Math.max(250, 70 + (4 + (i.obs ? quebra(ctx, "Obs: " + i.obs, 520).length : 0) + (i.descricao ? quebra(ctx, "Personalizado: " + i.descricao, 520).length : 0)) * 38 + 24); });
      var temPerso = itens.some(function (i) { return i.acombinar; }), H = 330 + alt.reduce(function (a, b) { return a + b + 20; }, 0) + (temPerso ? 160 : 100); cv.height = H;
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); ctx.fillStyle = "#D6231A"; ctx.fillRect(0, 0, W, 110);
      ctx.fillStyle = "#fff"; ctx.font = "700 40px Rowdies, Inter, sans-serif"; ctx.fillText("VIA DO PEDIDO", P, 66); ctx.font = "700 24px Inter, sans-serif"; ctx.fillText("Etiquetas escolares · vinil", P, 94);
      ctx.textAlign = "right"; ctx.font = "800 34px Inter, sans-serif"; ctx.fillText(p.codigo, W - P, 62); ctx.font = "600 22px Inter, sans-serif"; ctx.fillText("Vip Gráfica", W - P, 94); ctx.textAlign = "left";
      ctx.fillStyle = "#101C3F"; ctx.font = "800 30px Inter, sans-serif"; ctx.fillText("Cliente: " + p.cliente, P, 168);
      ctx.font = "600 24px Inter, sans-serif"; ctx.fillStyle = "#3B4560"; ctx.fillText("Telefone: " + (p.telefone || "—") + (p.cpf ? "   ·   CPF: " + cpfBr(p.cpf) : ""), P, 206); ctx.fillText("Data: " + dataBr(p.criado_em), P, 242);
      var y = 296; ctx.fillStyle = "#E1E7F3"; ctx.fillRect(P, y - 30, W - 2 * P, 3);
      itens.forEach(function (i, k) {
        var h = alt[k], sub = i.preco * i.qtd, aCombinar = !!i.acombinar;
        ctx.fillStyle = "#fff"; rr(ctx, P, y, W - 2 * P, h, 18); ctx.fill(); ctx.strokeStyle = "#CBD3E6"; ctx.lineWidth = 2; ctx.stroke();
        if (imgs[k]) { ctx.save(); rr(ctx, P + 16, y + 16, 200, 200, 12); ctx.clip(); ctx.drawImage(imgs[k], P + 16, y + 16, 200, 200); ctx.restore(); }
        var x = P + 244, yy = y + 52; ctx.fillStyle = "#D6231A"; ctx.font = "800 32px Inter, sans-serif"; ctx.fillText(i.qtd + "× " + i.modeloNome, x, yy);
        ctx.fillStyle = "#3B4560"; ctx.font = "600 24px Inter, sans-serif"; ctx.fillText(i.etiquetas + " etiquetas · " + i.tamanhos + (i.tamanhos === 1 ? " tamanho" : " tamanhos"), x, yy + 34);
        ctx.fillStyle = "#101C3F"; ctx.font = "800 28px Inter, sans-serif"; yy += 76; ctx.fillText("Tema: " + i.temaNome, x, yy);
        if (i.descricao) { ctx.font = "700 24px Inter, sans-serif"; ctx.fillStyle = "#D6231A"; quebra(ctx, "Personalizado: " + i.descricao, 520).forEach(function (l) { yy += 34; ctx.fillText(l, x, yy); }); ctx.fillStyle = "#101C3F"; }
        ctx.font = "700 26px Inter, sans-serif"; yy += 38; ctx.fillText("Nome: " + (i.nome || "—"), x, yy); yy += 38; ctx.fillText("Série/turma: " + (i.serie || "—"), x, yy);
        if (i.obs) { ctx.font = "600 24px Inter, sans-serif"; ctx.fillStyle = "#3B4560"; quebra(ctx, "Obs: " + i.obs, 520).forEach(function (l) { yy += 36; ctx.fillText(l, x, yy); }); }
        ctx.textAlign = "right"; ctx.fillStyle = "#101C3F"; ctx.font = "800 30px Inter, sans-serif"; ctx.fillText(aCombinar ? "a combinar" : brl(sub), W - P - 20, y + 52); ctx.font = "600 20px Inter, sans-serif"; ctx.fillStyle = "#6B7385"; ctx.fillText(aCombinar ? "valor a combinar" : brl(i.preco) + " cada", W - P - 20, y + 82); ctx.textAlign = "left";
        y += h + 20;
      });
      ctx.fillStyle = "#101C3F"; rr(ctx, P, y, W - 2 * P, 84, 16); ctx.fill(); ctx.fillStyle = "#fff"; ctx.font = "700 28px Inter, sans-serif"; ctx.fillText("TOTAL DO PEDIDO", P + 28, y + 52); ctx.textAlign = "right"; ctx.font = "800 40px Inter, sans-serif"; ctx.fillText(totalTxt(p), W - P - 28, y + 56); ctx.textAlign = "left";
      if (itens.some(function (i) { return i.acombinar; })) { y += 100; ctx.fillStyle = "#D6231A"; ctx.font = "700 24px Inter, sans-serif"; ctx.fillText("+ tema personalizado: valor a combinar com a cliente", P, y); y -= 100; }
      cv.toBlob(function (b) { var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "via-" + p.codigo + ".png"; document.body.appendChild(a); a.click(); a.remove(); }, "image/png");
    });
  }

  var salva = null; try { salva = JSON.parse(sessionStorage.getItem(SESSAO_KEY) || "null"); } catch (e) {}
  if (salva && salva.s) { st.sessao = salva.s; st.usuario = salva.u; entrar(); }
})();
</script>
