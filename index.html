  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 15px; font-weight: 600; font-size: 13.5px; transition: all .2s; }
  .chip:hover { border-color: var(--brand); color: var(--brand); }

  .busca { width: 100%; max-width: 360px; padding: 11px 16px; border: 1px solid var(--line); border-radius: 999px; background: #fff; margin-bottom: 8px; }
  .temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }

  .tema { position: relative; background: #fff; border: 2px solid transparent; border-radius: 14px; box-shadow: var(--shadow); padding: 0; overflow: hidden; text-align: left; transition: transform .2s, box-shadow .2s, border-color .2s; }
  .tema:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .tema .im { aspect-ratio: 1 / 1; background: #F0F3FA; overflow: hidden; }
  .tema img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }

  .tema .nm { padding: 9px 11px 11px; font-weight: 700; font-size: 13.5px; line-height: 1.25; }

  .skeleton { height: 220px; border-radius: 14px; background: linear-gradient(90deg, #eef2fa 25%, #f7f9fd 50%, #eef2fa 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }

  .rod-top img { height: 52px; width: auto; max-width: 160px; object-fit: contain; }
  .rod-top .nome-txt { font-family: var(--display); font-size: 22px; color: #fff; }
  .rod-btn { background: var(--brand); color: #fff; border-radius: 6px; padding: 11px 18px; font-weight: 700; font-size: 13.5px; text-decoration: none; }
  .rod-baixo p { margin: 0 0 6px; white-space: pre-line; }

  .demo-faixa { background: #FFC800; color: #3b2f00; text-align: center; font-size: 13px; font-weight: 700; padding: 7px 12px; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
</style>

  // ---------- demo ----------
  function arteTema(nome, a, b, emoji) {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><text x="150" y="185" font-size="120" text-anchor="middle">' + emoji + '</text></svg>';
    return "data:image/svg+xml;utf8," + encodeURIComponent(s);
  }
  function dadosDemo() {
    var t = [["Dinossauros", "#9be3a8", "#4aa86a", "🦖", "Meninos"], ["Unicórnio", "#f9c6ec", "#c58bf5", "🦄", "Meninas"], ["Futebol", "#a8e0ff", "#3d8bd9", "⚽", "Meninos"], ["Sereias", "#b4f0f0", "#4cc3d9", "🧜", "Meninas"], ["Espaço", "#9aa0ff", "#2b2f77", "🚀", "Meninos"], ["Flores", "#ffd1dc", "#ff8fa8", "🌸", "Meninas"], ["Safari", "#ffe29a", "#e0a030", "🦁", "Animais"], ["Gatinhos", "#ffd9b3", "#f29a5a", "🐱", "Animais"]];
    return { config: { nome: "Vip Gráfica", whatsapp: "19999999999", rodape: "" }, etiquetas: { precos: {}, temas: t.map(function (x, i) { return { id: "t" + i, nome: x[0], categoria: x[4], foto: arteTema(x[0], x[1], x[2], x[3]) }; }) } };
  }

  // ---------- carga ----------
  function carregar() {
    if (DEMO) { var d = dadosDemo(); estado.loja = d.config; estado.etq = d.etiquetas; return Promise.resolve(); }
    return fetch(SUPABASE_URL + "/rest/v1/app_storage?key=eq." + encodeURIComponent(CHAVE_PUBLICA) + "&select=value", {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }, cache: "no-store"
    }).then(function (r) { if (!r.ok) throw new Error("rede"); return r.json(); }).then(function (rows) {
      var v = rows && rows[0] ? rows[0].value : null;
      if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = null; } }
      if (!v) throw new Error("vazio");
      estado.loja = v.config || {};
      var e = v.etiquetas || {};
      estado.etq = { precos: e.precos && typeof e.precos === "object" ? e.precos : {}, temas: (Array.isArray(e.temas) ? e.temas : []).filter(function (t) { return t && t.id && t.nome && urlSegura(t.foto); }) };
    });
  }

  // ---------- topo / rodapé ----------
  function renderTopo() {
    var l = estado.loja, nome = l.nome || "Vip Gráfica", logo = urlSegura(l.logo);
    $("logoLink").innerHTML = logo ? '<img src="' + esc(logo) + '" alt="' + esc(nome) + '" />' : '<span class="nome-txt">' + esc(nome) + "</span>";
    if (DEMO) { $("faixaDemo").innerHTML = '<div class="demo-faixa">Pré-visualização com temas de exemplo — nada aqui é real e nenhum pedido é enviado de verdade.</div>'; }
    var wa = numeroWa();
    $("rodape").innerHTML = '<div class="rod-top">' + (logo ? '<img src="' + esc(logo) + '" alt="' + esc(nome) + '" />' : '<span class="nome-txt">' + esc(nome) + "</span>") +
      (wa ? '<a class="rod-btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/' + wa + '">Entrar em contato</a>' : "") + "</div>" +
      '<div class="rod-baixo"><p><b>Copyright © ' + new Date().getFullYear() + " " + esc(nome) + ". Todos os direitos reservados.</b></p>" + (l.rodape ? "<p>" + esc(l.rodape) + "</p>" : "") + "</div>";
    document.title = "Etiquetas escolares | " + nome;
  }
  function renderPassos() {
    [1, 2, 3].forEach(function (n) { var e = $("p" + n); e.className = "passo" + (estado.passo === n ? " on" : (estado.passo > n ? " ok" : "")); e.querySelector("b").textContent = estado.passo > n ? "✓" : n; });
    var n = estado.pedido.length; $("contador").textContent = n; $("abrirPedido").classList[n ? "remove" : "add"]("oculta");
  }

  // ---------- passo 1: modelo ----------
  function diagHtml(m) {
    return m.itens.map(function (it) {
      return '<div class="lin"><div class="zona"><div class="forma' + (it.redonda ? " redonda" : "") + '" style="--c:' + it.c + ";--w:" + it.w + ";--ar:" + it.ar + '"></div></div><div class="txt"><b>' + esc(it.tam) + " · " + it.qtd + " unidades</b><span>" + esc(it.uso) + "</span></div></div>";
    }).join("");
  }
  function viewModelos() {
    estado.passo = 1; barra(false);
    $("app").innerHTML = '<h2 class="tit">1. Escolha o modelo da cartela</h2><p class="sub">Folha de vinil, resistente à água. Cada cartela já vem com os tamanhos e quantidades abaixo.</p><div class="modelos">' +
      MODELOS.map(function (m) {
        return '<article class="modelo' + (estado.modelo === m.id ? " sel" : "") + '"><h3>' + esc(m.nome) + '</h3><div class="res">' + m.total + " etiquetas · " + m.tamanhos + (m.tamanhos === 1 ? " tamanho" : " tamanhos") + '</div>' +
          '<button class="exemplo" type="button" data-zoom="' + esc(m.img) + '" aria-label="Ampliar exemplo da ' + esc(m.nome) + '"><img src="' + esc(m.img) + '" alt="Exemplo da ' + esc(m.nome) + '" loading="lazy" /><span class="lupa">🔍 ampliar</span></button><p class="leg">Exemplo ilustrativo de como a cartela fica (nome e tema são só de exemplo)</p><div class="diag">' + diagHtml(m) + "</div>" +
          '<div class="preco-linha"><div class="preco">' + brl(precoDe(m)) + " <small>cada cartela</small></div></div>" +
          '<button class="btn" type="button" data-modelo="' + m.id + '">Escolher este modelo</button></article>';
      }).join("") + '</div><div class="obs">Não alteramos tamanhos e quantidades das cartelas.</div>';
    renderPassos(); window.scrollTo({ top: 0 });
  }

  // ---------- passo 2: tema ----------
  function categoriasTema() { var s = {}, l = []; estado.etq.temas.forEach(function (t) { var c = (t.categoria || "").trim(); if (c && !s[c]) { s[c] = 1; l.push(c); } }); return l; }
  function temasFiltrados() {
    var q = estado.busca.trim().toLowerCase();
    return estado.etq.temas.filter(function (t) { return (estado.cat === "Todos" || (t.categoria || "").trim() === estado.cat) && (!q || t.nome.toLowerCase().indexOf(q) >= 0); });
  }
  function viewTemas() {
    estado.passo = 2; var m = modeloPor(estado.modelo);
    if (!m) return viewModelos();
    var cats = categoriasTema();
    $("app").innerHTML = '<button class="voltar" type="button" id="vMod">← Trocar modelo</button>' +
      '<h2 class="tit">2. Escolha o tema</h2><div class="escolhido">Modelo escolhido: <b>' + esc(m.nome) + "</b> · " + brl(precoDe(m)) + "</div>" +
      (estado.etq.temas.length ? (cats.length ? '<div class="chips" id="chips">' + ["Todos"].concat(cats).map(function (c) { return '<button type="button" class="chip' + (c === estado.cat ? " on" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button>"; }).join("") + "</div>" : "") +
        '<input class="busca" id="buscaTema" type="search" placeholder="Buscar tema" autocomplete="off" value="' + esc(estado.busca) + '" aria-label="Buscar tema"><div class="temas" id="temas"></div>'
        : '<div class="vazio-aviso">Os temas ainda estão sendo cadastrados. Fale com a gente pelo WhatsApp que enviamos as opções.</div>');
    renderTemas(); renderPassos(); barraTema(); window.scrollTo({ top: 0 });
  }
  function renderTemas() {
    var box = $("temas"); if (!box) return;
    var l = temasFiltrados();
    box.innerHTML = l.length ? l.map(function (t) {
      return '<button class="tema' + (estado.tema === t.id ? " sel" : "") + '" type="button" data-tema="' + esc(t.id) + '"><div class="im">' + imgTema(t, estado.modelo, t.nome, ' loading="lazy"') + '</div><div class="nm">' + esc(t.nome) + "</div></button>";
    }).join("") : '<p class="sub" style="grid-column:1/-1">Nenhum tema encontrado.</p>';
  }
  function barra(on) { $("barra").classList[on ? "add" : "remove"]("show"); }
  function barraTema() {
    var t = temaPor(estado.tema);
    if (!t) return barra(false);
    $("barraInfo").textContent = "Tema: " + t.nome; $("barraBtn").textContent = "Continuar →"; barra(true);
  }

  // ---------- passo 3: finalizar ----------
  function totalPedido() { var s = 0, ok = true; estado.pedido.forEach(function (i) { var m = modeloPor(i.modelo); if (m) s += precoDe(m) * i.qtd; else ok = false; }); return ok ? s : null; }
  function viewFinal() {
    estado.passo = 3; barra(false);
    var m = modeloPor(estado.modelo), t = temaPor(estado.tema);
    if (!m || !t) return viewTemas();
    $("app").innerHTML = '<button class="voltar" type="button" id="vTema">← Trocar tema</button><h2 class="tit">3. Finalizar</h2><p class="sub">Confira, adicione o nome se quiser e envie o pedido pelo WhatsApp.</p>' +
      '<div class="final"><div class="caixa"><div class="prev">' + imgTema(t, m.id, t.nome) + '<div><h3>' + esc(m.nome) + "</h3><p>Tema: <b>" + esc(t.nome) + "</b></p><p>" + m.total + " etiquetas · " + brl(precoDe(m)) + " cada cartela</p></div></div>" +
      '<label class="f">Quantidade de cartelas<br><span class="qtd"><button type="button" id="menos" aria-label="Menos">−</button><span id="qv">' + estado.qtd + '</span><button type="button" id="mais" aria-label="Mais">+</button></span></label>' +
      '<div class="dois"><label class="f">Nome nas etiquetas (opcional)<input type="text" id="fNome" maxlength="60" placeholder="Ex: Maria Clara" value="' + esc(estado.nome) + '"></label>' +
      '<label class="f">Série / turma (opcional)<input type="text" id="fSerie" maxlength="40" placeholder="Ex: Maternal 1" value="' + esc(estado.serie) + '"></label></div>' +
      '<label class="f">Observação (opcional)<textarea id="fObs" rows="2" maxlength="300" placeholder="Turma, escola, algum detalhe…">' + esc(estado.obs) + "</textarea></label>" +
      '<div class="acoes"><button class="btn sec" type="button" id="addOutro">+ Adicionar à lista e escolher outra cartela</button></div></div>' +
      '<div class="caixa"><b style="font-size:16px">Seu pedido</b><div class="lista-ped" id="listaPed" style="margin-top:10px"></div><div class="total" id="totalBox"></div><p class="nota">O pagamento e a entrega são combinados no WhatsApp.</p>' +
      '<div class="dois"><label class="f">Seu nome *<input type="text" id="fCliente" maxlength="60" placeholder="Quem está fazendo o pedido" value="' + esc(estado.cliente) + '"></label>' +
      '<label class="f">Seu telefone (opcional)<input type="tel" id="fFone" maxlength="20" placeholder="(19) 99999-9999" value="' + esc(estado.fone) + '"></label></div>' +
      '<p class="nota" style="margin-top:12px">Ao enviar, o pedido fica registrado com a nossa equipe e você finaliza pelo WhatsApp.</p>' +
      '<div class="acoes"><button class="btn wa" type="button" id="enviar">Enviar pedido</button></div></div></div>';
    renderPassos(); renderLista(); window.scrollTo({ top: 0 });
  }
  function itemAtual() { return { modelo: estado.modelo, tema: estado.tema, qtd: estado.qtd, nome: estado.nome.trim(), serie: estado.serie.trim(), obs: estado.obs.trim() }; }
  function listaCompleta() { return estado.pedido.concat([itemAtual()]); }
  function renderLista() {
    var l = listaCompleta();
    $("listaPed").innerHTML = l.map(function (i, k) {
      var m = modeloPor(i.modelo), t = temaPor(i.tema); if (!m || !t) return "";
      return '<div class="item-ped">' + imgTema(t, i.modelo, "") + '<div class="t"><b>' + i.qtd + "× " + esc(m.nome) + "</b><span>" + esc(t.nome) + (i.nome ? " · " + esc(i.nome) : "") + (i.serie ? " · " + esc(i.serie) : "") + "</span></div>" +
        '<div style="font-weight:800;font-size:13.5px">' + brl(precoDe(m) * i.qtd) + "</div>" + (k < estado.pedido.length ? '<button class="x" type="button" data-rem="' + k + '" aria-label="Remover">×</button>' : "") + "</div>";
    }).join("");
    var s = 0; l.forEach(function (i) { var m = modeloPor(i.modelo); if (m) s += precoDe(m) * i.qtd; });
    $("totalBox").innerHTML = "<span>Total</span><span>" + brl(s) + "</span>";
  }
  function mensagem() {
    var l = listaCompleta(), nome = estado.loja.nome || "Vip Gráfica", s = 0;
    var linhas = ["Olá! Vim pelo catálogo da " + nome + " e quero fazer um pedido de *etiquetas escolares* (vinil resistente à água):", ""];
    l.forEach(function (i, k) {
      var m = modeloPor(i.modelo), t = temaPor(i.tema); if (!m || !t) return; s += precoDe(m) * i.qtd;
      linhas.push((k + 1) + ") " + i.qtd + "× " + m.nome + " (" + m.total + " etiquetas) — " + brl(precoDe(m)) + " cada");
      linhas.push("   Tema: " + t.nome);
      if (i.nome) linhas.push("   Nome: " + i.nome);
      if (i.serie) linhas.push("   Série: " + i.serie);
      if (i.obs) linhas.push("   Obs: " + i.obs);
    });
    linhas.push("", "*Total: " + brl(s) + "*", "", "Pedido *" + codigoPedido() + "* — pode confirmar para mim, por favor? 🙂");
    return linhas.join("\n");
  }
  function codigoPedido() {
    if (!estado.codigo) { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }, r = ""; var al = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; for (var i = 0; i < 4; i++) r += al.charAt(Math.floor(Math.random() * al.length));
      estado.codigo = "ET-" + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + "-" + r; }
    return estado.codigo;
  }
  function carregarImg(src) { return new Promise(function (res) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = src; }); }
  function quebra(ctx, txt, max) { var pal = String(txt).split(/\s+/), lin = [], at = ""; pal.forEach(function (w) { var t = at ? at + " " + w : w; if (ctx.measureText(t).width > max && at) { lin.push(at); at = w; } else at = t; }); if (at) lin.push(at); return lin; }
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function payloadPedido() {
    var itens = [], total = 0;
    listaCompleta().forEach(function (i) {
      var m = modeloPor(i.modelo), t = temaPor(i.tema); if (!m || !t) return;
      var pr = precoDe(m); total += pr * i.qtd;
      itens.push({ modelo: m.id, modeloNome: m.nome, etiquetas: m.total, tamanhos: m.tamanhos, preco: pr, qtd: i.qtd, tema: t.id, temaNome: t.nome, foto: fotoDe(t, m.id) || "", nome: i.nome, serie: i.serie, obs: i.obs });
    });
    return { itens: itens, total: Math.round(total * 100) / 100 };
  }
  function salvarPedido(tentativa) {
    var p = payloadPedido();
    return fetch(SUPABASE_URL + "/rest/v1/pedidos_etiquetas", {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ codigo: codigoPedido(), cliente: estado.cliente.trim(), telefone: estado.fone.trim() || null, itens: p.itens, total: p.total })
    }).then(function (r) {
      if (r.ok) return true;
      if (r.status === 409 && (tentativa || 0) < 3) { estado.codigo = ""; return salvarPedido((tentativa || 0) + 1); }
      throw new Error("HTTP " + r.status);
    });
  }
  function abrirWa() {
    var wa = numeroWa();
    if (DEMO) return toast("Na pré-visualização nada é enviado.");
    if (!wa) return toast("WhatsApp da loja não cadastrado.");
    window.open("https://wa.me/" + wa + "?text=" + encodeURIComponent(mensagem()), "_blank", "noopener");
  }
  function confirmacao(salvo) {
    var cod = codigoPedido(), el = document.createElement("div"); el.id = "via";
    el.innerHTML = '<div class="cx"><h3>' + (salvo ? "Pedido " + esc(cod) + " registrado!" : "Quase lá!") + '</h3>' +
      (salvo ? '<p class="nota" style="font-size:15px">Seu pedido já está com a nossa equipe. <b>Falta só um passo:</b> toque no botão abaixo e envie a mensagem no WhatsApp para combinarmos pagamento e entrega.</p>'
             : '<p class="nota" style="font-size:15px">Não conseguimos registrar o pedido agora, mas você pode enviar todos os detalhes pelo WhatsApp que a vendedora anota para você.</p>') +
      '<div class="acoes"><button class="btn wa" type="button" id="viaAbrir">Enviar pelo WhatsApp</button><button class="btn sec" type="button" id="viaFechar">Fazer outro pedido</button></div></div>';
    document.body.appendChild(el);
    $("viaAbrir").onclick = abrirWa;
    $("viaFechar").onclick = function () { el.remove(); estado.pedido = []; lsSet(LS, []); estado.codigo = ""; estado.nome = ""; estado.serie = ""; estado.obs = ""; estado.qtd = 1; estado.tema = null; viewModelos(); };
  }
  function enviar() {
    if (!estado.cliente.trim()) { toast("Informe o seu nome para enviar o pedido."); var c = $("fCliente"); if (c) c.focus(); return; }
    var b = $("enviar"), txt = b.textContent; b.disabled = true; b.textContent = "Enviando o pedido…";
    lsSet(LS + ":cliente", { n: estado.cliente, f: estado.fone });
    var fim = function (ok) { b.disabled = false; b.textContent = txt; confirmacao(ok); };
    if (DEMO) return fim(true);
    salvarPedido(0).then(function () { fim(true); }, function () { fim(false); });
  }

  // ---------- eventos ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return; var v;
    if ((v = t.getAttribute("data-zoom"))) { var z = document.createElement("div"); z.id = "zoom"; z.innerHTML = '<img src="' + esc(v) + '" alt="Exemplo da cartela" />'; z.addEventListener("click", function () { z.remove(); }); document.body.appendChild(z); return; }
    if ((v = t.getAttribute("data-modelo"))) { if (estado.modelo !== v) { estado.tema = null; } estado.modelo = v; return viewTemas(); }
    if ((v = t.getAttribute("data-cat"))) { estado.cat = v; var cs = document.querySelectorAll("#chips .chip"); for (var i = 0; i < cs.length; i++) cs[i].classList[cs[i].getAttribute("data-cat") === v ? "add" : "remove"]("on"); return renderTemas(); }
    if ((v = t.getAttribute("data-tema"))) { estado.tema = v; renderTemas(); return barraTema(); }
    if ((v = t.getAttribute("data-rem"))) { estado.pedido.splice(Number(v), 1); lsSet(LS, estado.pedido); renderPassos(); return renderLista(); }
    if (t.id === "barraBtn") return viewFinal();
    if (t.id === "vMod") return viewModelos();
    if (t.id === "vTema") return viewTemas();
    if (t.id === "mais") { estado.qtd = Math.min(50, estado.qtd + 1); $("qv").textContent = estado.qtd; return renderLista(); }
    if (t.id === "menos") { estado.qtd = Math.max(1, estado.qtd - 1); $("qv").textContent = estado.qtd; return renderLista(); }
    if (t.id === "addOutro") { estado.pedido.push(itemAtual()); lsSet(LS, estado.pedido); estado.tema = null; estado.modelo = null; estado.qtd = 1; estado.obs = ""; toast("Adicionado ao seu pedido."); return viewModelos(); }
    if (t.id === "enviar") return enviar();
    if (t.id === "abrirPedido") {
      if (!(estado.modelo && estado.tema) && estado.pedido.length) { var u = estado.pedido.pop(); estado.modelo = u.modelo; estado.tema = u.tema; estado.qtd = u.qtd; estado.nome = u.nome; estado.serie = u.serie || ""; estado.obs = u.obs; lsSet(LS, estado.pedido); }
      return viewFinal();
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "buscaTema") { estado.busca = e.target.value; return renderTemas(); }
    if (e.target.id === "fNome") { estado.nome = e.target.value; return renderLista(); }
    if (e.target.id === "fSerie") { estado.serie = e.target.value; return renderLista(); }
    if (e.target.id === "fCliente") { estado.cliente = e.target.value; return; }
    if (e.target.id === "fFone") { estado.fone = e.target.value; return; }
    if (e.target.id === "fObs") { estado.obs = e.target.value; }
  });

  // ---------- início ----------
  var cl = lsGet(LS + ":cliente", null); if (cl) { estado.cliente = cl.n || ""; estado.fone = cl.f || ""; }
  estado.pedido = (lsGet(LS, []) || []).filter(function (i) { return i && i.modelo && i.tema; });
  carregar().then(function () {
    estado.pedido = estado.pedido.filter(function (i) { return modeloPor(i.modelo) && temaPor(i.tema); });
    renderTopo(); viewModelos();
  }, function () {
    $("app").innerHTML = '<div class="vazio-aviso"><b>Não consegui carregar as etiquetas agora.</b><br>Confira sua internet e atualize a página. Se continuar, entre em contato com a gente.</div>'; barra(false);
  });
})();
</script>
</body>
</html>
